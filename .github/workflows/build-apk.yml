name: Verify TRACK Android Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build and check Android code
        run: ./gradlew :android-route:testDebugUnitTest :android-route:assembleDebug :android-route:lintDebug
      - name: Verify published APK version, checksum and signing certificate
        run: python3 tools/verify-release.py
      # The runner's newly generated debug key cannot upgrade an installed phone.
      # Distribute the verified, consistently signed release checked into the repo.
      - uses: actions/upload-artifact@v4
        with:
          name: TRACK-Route-EastGodavari-APK
          path: |
            release/TRACK-Route-EastGodavari.apk
            version.json
