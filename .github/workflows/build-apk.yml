name: Build & Release TRACK Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build TRACK Route APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew :android-route:assembleDebug

      - name: Copy Release APK
        run: |
          mkdir -p release
          cp android-route/build/outputs/apk/debug/android-route-debug.apk release/TRACK-Route-EastGodavari.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRACK-Route-EastGodavari-APK
          path: release/TRACK-Route-EastGodavari.apk
